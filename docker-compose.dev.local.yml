# TEMPORARY, untracked: standalone dev stack (api/worker/dashboard only) pointed at the
# already-running dev Postgres/Redis/MinIO containers (lumina_postgres/lumina_redis/lumina_minio,
# started outside this project's compose lifecycle) via host.docker.internal, instead of the
# infra/docker/docker-compose.yml services (whose fixed container_name: values collide with
# those already-running containers). Delete once no longer needed.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter api dev
    ports:
      - "4010:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://lumina:lumina@host.docker.internal:5435/lumina
      REDIS_URL: redis://host.docker.internal:6382
      JWT_SECRET: change-me-in-production
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: development
      LOG_LEVEL: debug
      S3_ENDPOINT: http://host.docker.internal:9010
      S3_BUCKET: lumina-media
      S3_ACCESS_KEY: lumina
      S3_SECRET_KEY: luminasecret
      S3_REGION: us-east-1
      CDN_BASE_URL: http://localhost:4010/v1/media
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/dashboard/node_modules
      - /app/packages/config/node_modules
      - /app/packages/prayer/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter worker dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://lumina:lumina@host.docker.internal:5435/lumina
      REDIS_URL: redis://host.docker.internal:6382
      NODE_ENV: development
      S3_ENDPOINT: http://host.docker.internal:9010
      S3_BUCKET: lumina-media
      S3_ACCESS_KEY: lumina
      S3_SECRET_KEY: luminasecret
      S3_REGION: us-east-1
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/dashboard/node_modules
      - /app/packages/config/node_modules
      - /app/packages/prayer/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter dashboard dev
    ports:
      - "3010:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4010/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/dashboard/.next
      - /app/packages/config/node_modules
      - /app/packages/prayer/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules
