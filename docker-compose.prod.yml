# Production: Traefik on host (HTTPS), joins the external `traefik-public` network.
# Requires: the traefik stack at /opt/traefik is running, and DNS A records for
# ${DOMAIN} and ${PLAYER_DOMAIN} point at this server.
#
# From this directory:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Loads config from ./.env (see .env.example) — copy it and fill in real secrets first.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumina
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio_init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/lumina-media;
      echo 'MinIO bucket ready';
      "
    restart: on-failure
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: "0.0.0.0"
      DASHBOARD_URL: "https://${DOMAIN}"
      # The player PWA runs on its own subdomain and calls this API directly from the
      # browser — must be CORS-whitelisted separately from DASHBOARD_URL (see main.ts).
      PLAYER_URL: "https://${PLAYER_DOMAIN}"
      DATABASE_URL: "postgresql://lumina:${POSTGRES_PASSWORD}@postgres:5432/lumina"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: lumina-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      # Routed through the api's own /v1/media proxy — the api's public router already
      # matches PathPrefix(`/v1`) below, so no extra Traefik route is needed. S3_ENDPOINT
      # above (the `minio` container hostname) is internal-only and can't be given to browsers.
      CDN_BASE_URL: "https://${DOMAIN}/v1/media"
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      CURRENCY_API_KEY: ${CURRENCY_API_KEY:-}
      FLIGHTS_API_KEY: ${FLIGHTS_API_KEY:-}
      PRAYER_CALCULATION_METHOD: ${PRAYER_CALCULATION_METHOD:-UmmAlQura}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.lumina-api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/v1`) || PathPrefix(`/docs`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.lumina-api.entrypoints=websecure"
      - "traefik.http.routers.lumina-api.tls=true"
      - "traefik.http.routers.lumina-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lumina-api.priority=100"
      - "traefik.http.services.lumina-api.loadbalancer.server.port=4000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://lumina:${POSTGRES_PASSWORD}@postgres:5432/lumina"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: lumina-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      CURRENCY_API_KEY: ${CURRENCY_API_KEY:-}
      FLIGHTS_API_KEY: ${FLIGHTS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://${DOMAIN}/v1"
        NEXT_PUBLIC_WS_URL: "https://${DOMAIN}"
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.lumina-dashboard.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.lumina-dashboard.entrypoints=websecure"
      - "traefik.http.routers.lumina-dashboard.tls=true"
      - "traefik.http.routers.lumina-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.lumina-dashboard.loadbalancer.server.port=3000"

  player:
    build:
      context: .
      dockerfile: apps/player/Dockerfile
      args:
        VITE_API_URL: "https://${DOMAIN}/v1"
        VITE_WS_URL: "https://${DOMAIN}"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.lumina-player.rule=Host(`${PLAYER_DOMAIN}`)"
      - "traefik.http.routers.lumina-player.entrypoints=websecure"
      - "traefik.http.routers.lumina-player.tls=true"
      - "traefik.http.routers.lumina-player.tls.certresolver=letsencrypt"
      - "traefik.http.services.lumina-player.loadbalancer.server.port=80"

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  traefik-public:
    external: true
  internal: {}
