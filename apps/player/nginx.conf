server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service worker / manifest must never be served with a long-lived cache — a stale
  # sw.js means a screen keeps running an old build forever with no way to update it.
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build assets are safe to cache indefinitely.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # react-router-dom client-side routing (pairing page, player page): fall back to
  # index.html for any path that isn't a real static file.
  location / {
    try_files $uri /index.html;
  }
}
