# Dev-only compose file for api, worker, and dashboard — hot-reload, not for production.
# Always run together with the infra file, from the repo root, so they land on the same network
# and relative paths (build context) resolve correctly:
#
#   docker compose --project-directory . -f infra/docker/docker-compose.yml -f docker-compose.dev.yml up --build
#
# (or `pnpm docker:dev`). Postgres/Redis/MinIO still come from infra/docker/docker-compose.yml,
# unchanged. apps/player is intentionally not included — still run natively via `pnpm dev`.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter api dev
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://lumina:lumina@postgres:5432/lumina
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      PORT: 4000
      NODE_ENV: development
      LOG_LEVEL: debug
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lumina-media
      S3_ACCESS_KEY: lumina
      S3_SECRET_KEY: luminasecret
      S3_REGION: us-east-1
      # Browser-facing (asset URLs returned to the dashboard) — must stay host-reachable.
      CDN_BASE_URL: http://localhost:9010/lumina-media
      # Windows bind mounts don't reliably deliver inotify events into the container — force
      # polling so `nest start --watch` actually notices file changes.
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/dashboard/node_modules
      - /app/packages/config/node_modules
      - /app/packages/prayer/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules
      # api's app.module.ts loadEnvFile() reads apps/api/.env first if present, and would
      # otherwise stomp the environment: block above with the host's localhost-pointing values.
      - ./.env.docker:/app/apps/api/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter worker dev
    environment:
      DATABASE_URL: postgresql://lumina:lumina@postgres:5432/lumina
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lumina-media
      S3_ACCESS_KEY: lumina
      S3_SECRET_KEY: luminasecret
      S3_REGION: us-east-1
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/dashboard/node_modules
      - /app/packages/config/node_modules
      - /app/packages/prayer/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules
      # worker's loadEnvFile() falls through to the root .env (no apps/worker/.env on host),
      # which also points at localhost — shadow it the same way.
      - ./.env.docker:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter dashboard dev
    ports:
      - "3000:3000"
    environment:
      # Fetched from the browser, not from inside the container — keep it host-reachable.
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      # Windows bind mounts don't reliably deliver inotify events — force webpack to poll.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/dashboard/.next
      - /app/packages/config/node_modules
      - /app/packages/prayer/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules
    depends_on:
      - api
