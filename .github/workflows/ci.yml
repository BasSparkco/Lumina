name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  ci:
    name: Install → Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina
          POSTGRES_DB: lumina
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lumina:lumina@localhost:5432/lumina
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: lumina-media
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: testtest
      CDN_BASE_URL: http://localhost:9000/lumina-media

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Migrate database
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # P9 (docs/tenant_isolation_and_platform_admin_plan.md) — the tenant-isolation IDOR matrix,
      # run over real HTTP against the real Nest app and this job's own Postgres/Redis services
      # (already migrated above), not a mocked Prisma delegate. Only apps/api has an e2e suite
      # today, so this calls it directly rather than through `turbo run test:e2e` (no other
      # workspace defines that task).
      - name: Test (e2e — tenant isolation)
        run: pnpm --filter api test:e2e

      - name: Build
        run: pnpm build
